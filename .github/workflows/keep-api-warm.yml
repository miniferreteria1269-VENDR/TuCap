name: Keep TuCap API warm

on:
  schedule:
    # Render free services sleep after 15 minutes without inbound traffic.
    # Run off the top of the hour to reduce GitHub schedule congestion.
    - cron: "2/5 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-tucap-api-warm
  cancel-in-progress: true

jobs:
  ping:
    name: Request health endpoint
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: GET /api/health
        env:
          HEALTH_URL: https://tucap-api.onrender.com/api/health
        run: |
          curl \
            --fail-with-body \
            --silent \
            --show-error \
            --location \
            --max-time 90 \
            --retry 2 \
            --retry-delay 5 \
            --retry-all-errors \
            "$HEALTH_URL"
          echo

services:
  - type: web
    name: tucap-api
    runtime: python
    plan: free
    region: virginia
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tucap-db
          property: connectionString
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: http://localhost:5173,https://tu-cap.vercel.app
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: BOOTSTRAP_TENANT_ID
        value: 00000000-0000-0000-0000-000000000001
      - key: BOOTSTRAP_TENANT_NAME
        value: TuCap Pilot
      - key: JWT_SECRET
        generateValue: true
      - key: BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administrador

databases:
  - name: tucap-db
    plan: free
    region: virginia
    databaseName: tucap
    user: tucap_user
    postgresMajorVersion: "17"
    ipAllowList: []
